name: Regression tests
on:
  pull_request:
  push:
    branches: [claude/meeting-notes-automation-6zppn]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketai_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: marketai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: PostgreSQL library integration tests
        run: python -m unittest discover -s tests -p test_project_library.py -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://marketai_test:test_only_password@localhost:5432/marketai_test
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
