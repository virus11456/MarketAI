<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MarketAI{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/admin.css">
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">M</div>
    <span class="brand-text">MarketAI</span>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">MAIN</div>
    <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>儀表板</span>
    </a>

    <div class="nav-section-label">TOOLS</div>
    <a href="/meeting" class="nav-item {% if active_page == 'meeting' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>會議記錄自動化</span>
    </a>
    <a href="/ad-report" class="nav-item {% if active_page == 'ad_report' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span>廣告月報產生器</span>
    </a>
    <a href="/work-dispatch" class="nav-item {% if active_page == 'work_dispatch' %}active{% endif %}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
      <span>工作包拆分派發</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-footer-text">
      <span class="powered">Powered by Claude AI</span>
    </div>
  </div>
</aside>

<!-- Main Content -->
<div class="main-wrapper">
  <!-- Top Bar -->
  <header class="topbar">
    <button class="topbar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="topbar-title">{% block page_title %}儀表板{% endblock %}</h1>
    <div class="topbar-right">
      <span class="topbar-badge">AI Ready</span>
    </div>
  </header>

  <!-- Page Content -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <p class="loading-text" id="loading-text">AI 處理中</p>
    <p class="loading-step" id="loading-step">準備中...</p>
  </div>
</div>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.querySelector('.main-wrapper').classList.toggle('expanded');
}
function showLoading(msg) {
  document.getElementById('loading').classList.add('show');
  document.getElementById('loading-step').textContent = msg || '處理中...';
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}
function showToast(msg, type) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
